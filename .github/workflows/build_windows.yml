name: Build Windows Release

on:
  push:
    branches: [supermarket]
  pull_request:
    branches: [supermarket]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release (.exe)
        run: flutter build windows --release

      - name: Bundle Essential DLLs (sqlite3, d3dcompiler_47 & VC Runtime)
        shell: pwsh
        run: |
          # 1. Copy local verified 64-bit sqlite3.dll into release folder
          Copy-Item "windows\sqlite3.dll" -Destination "build\windows\x64\runner\Release\" -Force -ErrorAction SilentlyContinue
          Copy-Item "windows\libs\sqlite3.dll" -Destination "build\windows\x64\runner\Release\" -Force -ErrorAction SilentlyContinue

          # 2. Bundle DirectX & Microsoft Visual C++ Runtime DLLs
          Copy-Item "C:\Windows\System32\d3dcompiler_47.dll" -Destination "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\vcruntime140.dll" -Destination "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\vcruntime140_1.dll" -Destination "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\msvcp140.dll" -Destination "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue
          Copy-Item "C:\Windows\System32\winsqlite3.dll" -Destination "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue

      - name: Compress Release Bundle into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath shop_system_windows_x64.zip -Force

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-system-windows-x64
          path: shop_system_windows_x64.zip
          retention-days: 30
